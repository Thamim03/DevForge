name: DevForge CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore Dependencies
      run: dotnet restore DevForge.slnx

    - name: Build Solution
      run: dotnet build DevForge.slnx --configuration Release --no-restore

    - name: Run Tests
      run: dotnet test DevForge.slnx --configuration Release --no-build --verbosity normal

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'src/DevForge.Web/package-lock.json'

    - name: Install Dependencies
      run: npm ci
      working-directory: src/DevForge.Web

    - name: Build App
      run: npm run build
      working-directory: src/DevForge.Web
