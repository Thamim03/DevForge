name: DevForge CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build and Test Solution
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore Dependencies
      run: dotnet restore DevForge.slnx

    - name: Build Solution
      run: dotnet build DevForge.slnx --configuration Release --no-restore

    - name: Run Tests
      run: dotnet test DevForge.slnx --configuration Release --no-build --verbosity normal
