services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: devforge-db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=DevForgeLocalPassword123!
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql

  api:
    image: devforge-api
    container_name: devforge-api
    build:
      context: .
      dockerfile: src/DevForge.API/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=DevForge;User Id=sa;Password=DevForgeLocalPassword123!;TrustServerCertificate=True;
      - Cors__AllowedOrigins__0=http://localhost:8080
    ports:
      - "5000:8080"
    depends_on:
      - sqlserver

  web:
    image: devforge-web
    container_name: devforge-web
    build:
      context: .
      dockerfile: src/DevForge.Web/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=DevForge;User Id=sa;Password=DevForgeLocalPassword123!;TrustServerCertificate=True;
      - ApiSettings__BaseUrl=http://localhost:5000
    ports:
      - "8080:8080"
    depends_on:
      - api

volumes:
  mssql-data:
